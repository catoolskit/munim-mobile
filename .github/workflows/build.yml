name: Build MUNIM Mobile APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9'
          channel: 'stable'

      - name: Create Flutter project scaffold
        run: |
          flutter create --org com.catoolskit --project-name munim_mobile /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Fix Kotlin duplicate class issue
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNIM-Mobile-APK
          path: build/app/outputs/flutter-apk/app-release.apk
