name: Build MUNIM Mobile APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project scaffold
        run: |
          flutter create --org com.catoolskit --project-name munim_mobile /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo "=== build.gradle ==="
          cat android/build.gradle

      - name: Fix Kotlin version
        run: |
          python3 -c "
          import re
          with open('android/settings.gradle', 'r') as f:
              content = f.read()
          print('BEFORE:', content)
          content = re.sub(
              r'id [\"\\']org\.jetbrains\.kotlin\.android[\"\\'] version [\"\\'][^\"\\']*[\"\\']',
              'id \"org.jetbrains.kotlin.android\" version \"2.0.21\"',
              content
          )
          print('AFTER:', content)
          with open('android/settings.gradle', 'w') as f:
              f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNIM-Mobile-APK
          path: build/app/outputs/flutter-apk/app-release.apk
