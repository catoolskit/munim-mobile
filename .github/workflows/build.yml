name: Build MUNIM Mobile APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter project scaffold
        run: |
          flutter create --org com.catoolskit --project-name munim_mobile /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          cp /tmp/scaffold/pubspec.yaml /tmp/pubspec_scaffold.yaml || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          cd android
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.0"/' build.gradle
          cd ..
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MUNIM-Mobile-APK
          path: build/app/outputs/flutter-apk/app-release.apk
